<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | LEVEL-UP</title>
  <meta name="description" content="LEVEL-UP admin dashboard: members, bookings and trainers.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050807">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/app/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LEVEL-UP">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610042136">
  <link rel="stylesheet" href="shop.css?v=202610042136">
  <link rel="stylesheet" href="profile.css?v=202610042136">
  <link rel="stylesheet" href="admin.css?v=202610042136">
</head>
<body>

  <!-- Loading screen: appears only when loading takes a moment (see #boot in style.css and game.js) -->
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-inner">
      <img src="img/app/icon-192.png" alt="" width="84" height="84">
      <p class="boot-title">Loading<span class="boot-dots" aria-hidden="true"></span></p>
      <div class="boot-bar"><i id="bootFill"></i></div>
      <p class="boot-step" id="bootStep">Press start…</p>
      <p class="boot-tip" id="bootTip"></p>
    </div>
  </div>

  <div class="xp-track" aria-hidden="true"><div class="xp-fill" id="xpFill"></div></div>

  <header class="hud" id="hud">
    <a href="index.html" class="brand" aria-label="LEVEL-UP home">
      <img src="img/logo.JPG" alt="" class="brand-logo">
      <span class="brand-name">LEVEL-UP</span>
    </a>

    <nav class="nav" id="nav" aria-label="Main">
      <a href="index.html#about">Play</a>
      <a href="index.html#programs">Classes</a>
      <a href="index.html#team">Party</a>
      <a href="index.html#schedule">Book</a>
      <a href="index.html#contact">Contact</a>
      <a href="shop.html" class="nav-shop">
        <span class="coin" aria-hidden="true"></span> Shop
      </a>
    </nav>

    <div class="hud-account" id="hudAccount"></div>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="profile-page admin-page">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container" id="adminRoot"></div>
  </main>

  <footer class="footer">
    <div class="vine-divider" aria-hidden="true"></div>
    <div class="container footer-inner">
      <a href="index.html" class="brand">
        <img src="img/logo.JPG" alt="" class="brand-logo">
        <span class="brand-name">LEVEL-UP</span>
      </a>
      <p>© <span id="year">2026</span> LEVEL-UP Personal Training. All rights reserved.</p>
      <p class="footer-hint">Game master console</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="game.js?v=202610042136"></script>
  <script src="statements.js?v=202610042136"></script>
  <script src="hours-editor.js?v=202610042136"></script>
  <script src="hours-planner.js?v=202610042136"></script>
  <script src="admin.js?v=202610042136"></script>
</body>
</html>
