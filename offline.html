<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | LEVEL-UP</title>
  <meta name="theme-color" content="#070707">
  <link rel="icon" href="img/app/favicon-64.png">
  <style>
    :root { color-scheme: dark; --bg: #070707; --panel: #151515; --line: #2e2e2e; --text: #f3f3f3; --muted: #b0b0b0; --green: #7cff6b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-image: linear-gradient(115deg, transparent 0 58%, rgba(255,255,255,.035) 58% 64%, transparent 64%); }
    main { width: min(420px, 100%); padding: 28px 24px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    img { width: 96px; height: 96px; }
    h1 { margin: 14px 0 6px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-stretch: condensed; font-style: italic; font-weight: 800; font-size: 1.7rem; letter-spacing: .02em; text-transform: uppercase; }
    img { border-radius: 18px; }
    p { margin: 0 0 18px; color: var(--muted); }
    button { font: 700 .95rem/1 system-ui, sans-serif; padding: 14px 18px; width: 100%; color: #000; background: var(--green); border: 0; border-radius: 6px; transform: skewX(-10deg); font-style: italic; text-transform: uppercase; cursor: pointer; }
    small { display: block; margin-top: 14px; color: var(--muted); }
    a { color: var(--green); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <img src="img/app/icon-192.png" alt="">
    <h1>Connection lost</h1>
    <p>You're offline. Bookings, your XP and your account need an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Try again ▶</button>
    <small>Questions? Call or WhatsApp <a href="tel:+32471955489">+32 471 95 54 89</a></small>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
